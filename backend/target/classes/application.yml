spring:
  application:
    name: lineage

server:
  port: ${PORT:8080}
  error:
    include-message: always

lineage:
  falkordb:
    host: ${FALKORDB_HOST:localhost}
    port: ${FALKORDB_PORT:6379}
    user: ${FALKORDB_USER:}
    password: ${FALKORDB_PASSWORD:}
    project-graph: ${FALKORDB_PROJECT_GRAPH:lineage_demo}
  github:
    token: ${GITHUB_TOKEN:}
    repository: ${LINEAGE_REPOSITORY:}
  llm:
    api-key: ${LLM_API_KEY:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  ingest:
    enabled: ${INGEST_ENABLED:false}